name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++-14 gcc-14 libbz2-dev zlib1g-dev lcov libgtest-dev
        sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-14 100

    - name: Configure CMake
      env:
        CC: gcc-14
        CXX: g++-14
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Debug

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C Debug -E sync_test --output-on-failure

    - name: Generate Coverage
      working-directory: ${{github.workspace}}/build
      run: make coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: build/coverage.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Update Coverage Badge in README
      run: |
        python3 .github/scripts/update_coverage_badge.py --language "C++" --lcov build/coverage.info
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: Update C++ coverage badge in README [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
        fi

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/coverage_report/
